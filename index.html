<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMessenger | Premium</title>
<!-- Подключаем современные шрифты и иконки -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
  :root {
    --bg-main: #0f1115;
    --bg-sidebar: #17191f;
    --bg-panel: #21242d;
    --accent: #5865F2; /* Цвет Discord */
    --accent-hover: #4752C4;
    --text-main: #f2f3f5;
    --text-muted: #949ba4;
    --danger: #ed4245;
    --success: #23a559;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

  /* Скроллбары */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f4147; border-radius: 10px; }

  /* Экран логина (Стеклянный эффект) */
  #loginScreen {
    position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover;
    display: flex; justify-content: center; align-items: center; z-index: 1000;
  }
  .login-glass {
    background: rgba(23, 25, 31, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
    width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .login-glass h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #fff, #a5a5a5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .login-glass p { color: var(--text-muted); margin-bottom: 30px; }
  .login-glass input {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: white; font-size: 16px; margin-bottom: 20px; outline: none; transition: 0.3s;
  }
  .login-glass input:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); }
  .login-glass button {
    width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--accent);
    color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .login-glass button:hover { background: var(--accent-hover); transform: translateY(-2px); }

  /* Боковая панель */
  .sidebar { width: 300px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); z-index: 10; }
  .brand { padding: 20px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  
  .user-profile { padding: 20px; display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.1); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; }
  .avatar-me { background: linear-gradient(135deg, var(--accent), #b147c4); }
  .user-info h3 { font-size: 15px; font-weight: 600; }
  .user-info span { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 4px; }
  .user-info span::before { content: ''; display: block; width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

  .nav-title { padding: 20px 20px 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .online-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .online-user {
    padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; transition: 0.2s; cursor: pointer;
  }
  .online-user:hover { background: rgba(255,255,255,0.05); }
  .online-user .avatar { width: 32px; height: 32px; font-size: 14px; background: var(--bg-panel); }
  
  .call-action { padding: 20px; }
  .btn-call {
    width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--success); color: white; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(35, 165, 89, 0.3);
  }
  .btn-call:hover { background: #1e8f4c; transform: translateY(-2px); }
  .btn-call.in-call { background: var(--danger); box-shadow: 0 4px 15px rgba(237, 66, 69, 0.3); }
  .btn-call.in-call:hover { background: #c9383b; }

  /* Главная область чата */
  .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
  .chat-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: var(--bg-main); z-index: 5; }
  .chat-header h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-header .status { font-size: 14px; color: var(--text-muted); background: var(--bg-panel); padding: 4px 12px; border-radius: 20px; }

  .messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  
  .msg-wrapper { display: flex; flex-direction: column; max-width: 70%; }
  .msg-wrapper.them { align-self: flex-start; }
  .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
  
  .msg-info { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  
  .msg-bubble { padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .msg-wrapper.them .msg-bubble { background: var(--bg-panel); border-bottom-left-radius: 4px; }
  .msg-wrapper.me .msg-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }

  .sys-msg { align-self: center; background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 20px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

  .chat-input { padding: 20px 30px; background: var(--bg-main); }
  .input-box {
    display: flex; align-items: center; background: var(--bg-panel); border-radius: 16px; padding: 8px 8px 8px 20px; transition: 0.2s; border: 1px solid transparent;
  }
  .input-box:focus-within { border-color: rgba(88, 101, 242, 0.5); }
  .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; }
  .input-box button {
    width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
  }
  .input-box button:hover { background: var(--accent-hover); transform: scale(1.05); }

  /* Видео-оверлей */
  #videoOverlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 17, 21, 0.95);
    backdrop-filter: blur(10px); z-index: 50; display: none; flex-direction: column;
  }
  #videoOverlay.active { display: flex; }
  
  .video-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
  .video-grid { flex: 1; padding: 20px 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; overflow-y: auto; }
  
  .video-card { background: var(--bg-panel); border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); aspect-ratio: 16/9; border: 1px solid rgba(255,255,255,0.05); }
  .video-card video { width: 100%; height: 100%; object-fit: cover; }
  .video-card .badge { position: absolute; bottom: 16px; left: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  
  .video-controls { padding: 30px; display: flex; justify-content: center; gap: 20px; }
  .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--bg-panel); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 24px; }
  .ctrl-btn:hover { background: #2f3340; transform: translateY(-4px); }
  .ctrl-btn.off { background: rgba(255,255,255,0.1); color: var(--text-muted); }
  .ctrl-btn.end { background: var(--danger); }
  .ctrl-btn.end:hover { background: #c9383b; }
</style>
</head>
<body>

<!-- Экран логина -->
<div id="loginScreen">
  <div class="login-glass">
    <h1>NMessenger</h1>
    <p>Добро пожаловать в защищенное пространство</p>
    <input type="text" id="usernameInput" placeholder="Как вас зовут?" maxlength="20">
    <button onclick="login()">Продолжить</button>
  </div>
</div>

<!-- Левая панель -->
<aside class="sidebar">
  <div class="brand">
    <span class="material-symbols-outlined" style="color: var(--accent)">forum</span>
    NMessenger
  </div>
  
  <div class="user-profile">
    <div class="avatar avatar-me" id="myAvatar">?</div>
    <div class="user-info">
      <h3 id="myName">User</h3>
      <span>В сети</span>
    </div>
  </div>

  <div class="nav-title">Участники онлайн</div>
  <div class="online-list" id="onlineList">
    <!-- Список загружается через JS -->
  </div>

  <div class="call-action">
    <button class="btn-call" id="callBtn" onclick="toggleCall()">
      <span class="material-symbols-outlined">call</span>
      <span>Начать аудио/видео</span>
    </button>
  </div>
</aside>

<!-- Главный чат -->
<main class="chat-container">
  <header class="chat-header">
    <h2><span class="material-symbols-outlined" style="color: var(--text-muted)">tag</span> Общая комната</h2>
    <div class="status" id="onlineCount">0 участников</div>
  </header>

  <div class="messages" id="messages">
    <div class="sys-msg"><span class="material-symbols-outlined" style="font-size:16px;">shield</span> Сообщения защищены сквозным шифрованием (LiveKit)</div>
  </div>

  <div class="chat-input">
    <div class="input-box">
      <input type="text" id="msgInput" placeholder="Написать в Общая комната..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()"><span class="material-symbols-outlined">send</span></button>
    </div>
  </div>

  <!-- Оверлей видеозвонка -->
  <div id="videoOverlay">
    <header class="video-header">
      <h2><span class="material-symbols-outlined">videocam</span> Активный звонок</h2>
      <div class="status" style="background:var(--accent); padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600;">В эфире</div>
    </header>
    
    <div class="video-grid" id="videoGrid"></div>
    
    <div class="video-controls">
      <button class="ctrl-btn" id="micBtn" onclick="toggleMic()">
        <span class="material-symbols-outlined">mic</span>
      </button>
      <button class="ctrl-btn" id="camBtn" onclick="toggleCam()">
        <span class="material-symbols-outlined">videocam</span>
      </button>
      <button class="ctrl-btn end" onclick="endCall()">
        <span class="material-symbols-outlined">call_end</span>
      </button>
    </div>
  </div>
</main>

<script>
  const socket = io();
  let myUsername = '';
  let livekitRoom = null;
  let micEnabled = true;
  let camEnabled = true;

  function login() {
    const input = document.getElementById('usernameInput');
    const name = input.value.trim();
    if (!name) return alert('Пожалуйста, введите имя');
    
    myUsername = name;
    document.getElementById('loginScreen').style.opacity = '0';
    setTimeout(() => { document.getElementById('loginScreen').style.display = 'none'; }, 300);
    
    document.getElementById('myName').textContent = name;
    document.getElementById('myAvatar').textContent = name[0].toUpperCase();
    
    socket.emit('user_join', name);
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    
    socket.emit('send_message', { user: myUsername, text: text });
    input.value = '';
  }

  socket.on('receive_message', (data) => {
    const isMe = data.user === myUsername;
    const messages = document.getElementById('messages');
    
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;
    
    wrapper.innerHTML = `
      <div class="msg-info">
        ${isMe ? '' : `<strong>${data.user}</strong>`}
        <span>${data.time}</span>
      </div>
      <div class="msg-bubble">${escapeHtml(data.text)}</div>
    `;
    
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('system_message', (text) => {
    const messages = document.getElementById('messages');
    messages.innerHTML += `<div class="sys-msg">${text}</div>`;
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('users_update', (users) => {
    const list = document.getElementById('onlineList');
    list.innerHTML = '';
    users.forEach(user => {
      list.innerHTML += `
        <div class="online-user">
          <div class="avatar">${user[0].toUpperCase()}</div>
          <span style="flex:1; font-size:14px;">${user}</span>
        </div>
      `;
    });
    document.getElementById('onlineCount').textContent = `${users.length} участников`;
  });

  // Логика звонков
  socket.on('incoming_call', (data) => {
    if (confirm(`📞 ${data.from} начал звонок в общей комнате. Присоединиться?`)) {
      joinCall('main-room');
    }
  });

  async function toggleCall() {
    if (livekitRoom) {
      endCall();
    } else {
      socket.emit('call_started', { from: myUsername, room: 'main-room' });
      await joinCall('main-room');
    }
  }

  async function joinCall(roomName) {
    try {
      const btn = document.getElementById('callBtn');
      btn.innerHTML = `<span class="material-symbols-outlined">hourglass_empty</span> Подключение...`;
      
      const response = await fetch('/get-livekit-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomName, participantName: myUsername })
      });
      const { token, url } = await response.json();
      
      livekitRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
      livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
      livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantLeft);

      await livekitRoom.connect(url, token);
      await livekitRoom.localParticipant.enableCameraAndMicrophone();

      const videoTrack = livekitRoom.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
      if (videoTrack && videoTrack.track) addVideo(videoTrack.track, myUsername + ' (Вы)', 'local');

      document.getElementById('videoOverlay').classList.add('active');
      btn.className = 'btn-call in-call';
      btn.innerHTML = `<span class="material-symbols-outlined">call_end</span> Завершить звонок`;
    } catch (err) {
      alert('Ошибка подключения: ' + err.message);
      endCall();
    }
  }

  function handleTrackSubscribed(track, publication, participant) {
    if (track.kind === 'video' || track.kind === 'audio') addVideo(track, participant.identity, participant.sid);
  }

  function addVideo(track, name, id) {
    let container = document.getElementById('vid-' + id);
    if (!container) {
      container = document.createElement('div');
      container.className = 'video-card';
      container.id = 'vid-' + id;
      container.innerHTML = `<div class="badge"><span class="material-symbols-outlined" style="font-size:16px;">person</span> ${name}</div>`;
      document.getElementById('videoGrid').appendChild(container);
    }
    const el = track.attach();
    container.insertBefore(el, container.firstChild);
  }

  function handleParticipantLeft(participant) {
    const el = document.getElementById('vid-' + participant.sid);
    if (el) el.remove();
  }

  function endCall() {
    if (livekitRoom) livekitRoom.disconnect();
    livekitRoom = null;
    document.getElementById('videoOverlay').classList.remove('active');
    document.getElementById('videoGrid').innerHTML = '';
    const btn = document.getElementById('callBtn');
    btn.className = 'btn-call';
    btn.innerHTML = `<span class="material-symbols-outlined">call</span> Начать аудио/видео`;
  }

  async function toggleMic() {
    if (!livekitRoom) return;
    micEnabled = !micEnabled;
    await livekitRoom.localParticipant.setMicrophoneEnabled(micEnabled);
    const btn = document.getElementById('micBtn');
    btn.classList.toggle('off', !micEnabled);
    btn.innerHTML = `<span class="material-symbols-outlined">${micEnabled ? 'mic' : 'mic_off'}</span>`;
  }

  async function toggleCam() {
    if (!livekitRoom) return;
    camEnabled = !camEnabled;
    await livekitRoom.localParticipant.setCameraEnabled(camEnabled);
    const btn = document.getElementById('camBtn');
    btn.classList.toggle('off', !camEnabled);
    btn.innerHTML = `<span class="material-symbols-outlined">${camEnabled ? 'videocam' : 'videocam_off'}</span>`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
