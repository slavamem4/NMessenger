<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMessenger</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0d0d0d; color: #fff; height: 100vh; overflow: hidden; }
  
  /* Экран входа */
  #loginScreen {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }
  .login-box {
    background: #1e1e2e; padding: 40px; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; width: 350px;
    border: 1px solid #2a2a3e;
  }
  .login-box h1 { color: #a78bfa; margin-bottom: 10px; font-size: 32px; }
  .login-box p { color: #888; margin-bottom: 25px; font-size: 14px; }
  .login-box input {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
    background: #16161f; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none;
  }
  .login-box input:focus { border-color: #a78bfa; }
  .login-box button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
    color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    transition: transform 0.2s;
  }
  .login-box button:hover { transform: translateY(-2px); }
  
  /* Основной экран */
  #mainScreen { display: none; height: 100vh; }
  .app { display: flex; height: 100vh; }
  
  /* Боковая панель */
  .sidebar {
    width: 280px; background: #14141c; border-right: 1px solid #2a2a3e;
    display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 20px; border-bottom: 1px solid #2a2a3e;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 45px; height: 45px; border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 18px;
  }
  .user-info h3 { font-size: 16px; }
  .user-info span { font-size: 12px; color: #4ade80; }
  
  .sidebar-title {
    padding: 15px 20px 10px; color: #666; font-size: 12px;
    text-transform: uppercase; font-weight: bold;
  }
  .online-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .online-user {
    padding: 12px 15px; border-radius: 10px; display: flex;
    align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s;
  }
  .online-user:hover { background: #1e1e2e; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #4ade80;
  }
  
  .call-button {
    margin: 15px; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
    color: #fff; font-size: 15px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .call-button:hover { opacity: 0.9; }
  .call-button.end { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
  
  /* Область чата */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: #0d0d15; }
  .chat-header {
    padding: 20px; border-bottom: 1px solid #2a2a3e;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h2 { color: #a78bfa; }
  
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 4px; }
  
  .message {
    max-width: 60%; padding: 12px 16px; border-radius: 15px;
    background: #1e1e2e; word-wrap: break-word;
  }
  .message.own {
    align-self: flex-end;
    background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
  }
  .message .name { font-size: 12px; color: #a78bfa; margin-bottom: 4px; font-weight: bold; }
  .message.own .name { color: #f0f0f0; }
  .message .time { font-size: 10px; color: #888; margin-top: 4px; text-align: right; }
  .message.own .time { color: #ddd; }
  
  .system-message {
    align-self: center; padding: 6px 15px; background: #1a1a2e;
    border-radius: 20px; font-size: 12px; color: #888;
  }
  
  .input-area {
    padding: 20px; border-top: 1px solid #2a2a3e; display: flex; gap: 10px;
  }
  .input-area input {
    flex: 1; padding: 14px; border-radius: 25px; border: 1px solid #333;
    background: #1e1e2e; color: #fff; font-size: 15px; outline: none;
  }
  .input-area input:focus { border-color: #a78bfa; }
  .input-area button {
    padding: 14px 25px; border-radius: 25px; border: none;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    color: #fff; font-weight: bold; cursor: pointer;
  }
  
  /* Область звонков */
  #videoArea {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.95);
    z-index: 100; padding: 20px;
  }
  #videoArea.active { display: flex; flex-direction: column; }
  .video-header {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 10px 20px;
  }
  .video-grid {
    flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 15px; padding: 20px; overflow-y: auto;
  }
  .video-container {
    background: #1a1a2e; border-radius: 15px; overflow: hidden;
    position: relative; aspect-ratio: 16/9;
  }
  .video-container video { width: 100%; height: 100%; object-fit: cover; }
  .video-container .label {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 8px;
    color: #fff; font-size: 14px;
  }
  .controls {
    display: flex; justify-content: center; gap: 15px; padding: 20px;
  }
  .ctrl-btn {
    width: 55px; height: 55px; border-radius: 50%; border: none;
    background: #2a2a3e; color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { background: #3a3a4e; }
  .ctrl-btn.end { background: #ef4444; }
  .ctrl-btn.off { background: #666; }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="loginScreen">
  <div class="login-box">
    <h1>💬 NMessenger</h1>
    <p>Чат и звонки без границ</p>
    <input type="text" id="usernameInput" placeholder="Введи свое имя..." maxlength="20">
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- Основной экран -->
<div id="mainScreen">
  <div class="app">
    <!-- Боковая панель -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="myAvatar">?</div>
        <div class="user-info">
          <h3 id="myName">-</h3>
          <span>● Online</span>
        </div>
      </div>
      <div class="sidebar-title">Онлайн</div>
      <div class="online-list" id="onlineList"></div>
      <button class="call-button" id="callBtn" onclick="toggleCall()">
        📞 Начать звонок
      </button>
    </div>
    
    <!-- Область чата -->
    <div class="chat-area">
      <div class="chat-header">
        <h2># Общий чат</h2>
        <span id="onlineCount">0 онлайн</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input type="text" id="msgInput" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>
</div>

<!-- Область видеозвонков -->
<div id="videoArea">
  <div class="video-header">
    <h2>🎥 Групповой звонок</h2>
    <span id="callRoomName">Комната: main</span>
  </div>
  <div class="video-grid" id="videoGrid"></div>
  <div class="controls">
    <button class="ctrl-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <button class="ctrl-btn" id="camBtn" onclick="toggleCam()">📹</button>
    <button class="ctrl-btn end" onclick="endCall()">📞</button>
  </div>
</div>

<script>
  const socket = io();
  let myUsername = '';
  let currentRoom = null;
  let livekitRoom = null;
  let micEnabled = true;
  let camEnabled = true;

  // Вход в чат
  function login() {
    const input = document.getElementById('usernameInput');
    const name = input.value.trim();
    if (!name) { alert('Введи имя!'); return; }
    
    myUsername = name;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('myName').textContent = name;
    document.getElementById('myAvatar').textContent = name[0].toUpperCase();
    
    socket.emit('user_join', name);
  }

  // Отправка сообщения
  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    
    socket.emit('send_message', { user: myUsername, text: text });
    input.value = '';
  }

  // Получение сообщений
  socket.on('receive_message', (data) => {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message' + (data.user === myUsername ? ' own' : '');
    div.innerHTML = `
      <div class="name">${data.user}</div>
      <div>${escapeHtml(data.text)}</div>
      <div class="time">${data.time}</div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });

  // Системные сообщения
  socket.on('system_message', (text) => {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'system-message';
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });

  // Обновление списка онлайн
  socket.on('users_update', (users) => {
    const list = document.getElementById('onlineList');
    list.innerHTML = '';
    users.forEach(user => {
      const div = document.createElement('div');
      div.className = 'online-user';
      div.innerHTML = `
        <div class="avatar" style="width:35px;height:35px;font-size:14px">${user[0].toUpperCase()}</div>
        <div style="flex:1">${user}</div>
        <div class="status-dot"></div>
      `;
      list.appendChild(div);
    });
    document.getElementById('onlineCount').textContent = users.length + ' онлайн';
  });

  // Входящий звонок
  socket.on('incoming_call', (data) => {
    if (confirm(`📞 ${data.from} начал звонок! Присоединиться?`)) {
      joinCall(data.room);
    }
  });

  // Кнопка звонка
  async function toggleCall() {
    if (livekitRoom) {
      endCall();
    } else {
      const roomName = 'main-room';
      socket.emit('call_started', { from: myUsername, room: roomName });
      await joinCall(roomName);
    }
  }

  // Присоединение к звонку
  async function joinCall(roomName) {
    try {
      const response = await fetch('/get-livekit-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomName, participantName: myUsername })
      });
      
      const { token, url } = await response.json();
      
      livekitRoom = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true,
      });

      livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
      livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantLeft);

      await livekitRoom.connect(url, token);
      await livekitRoom.localParticipant.enableCameraAndMicrophone();

      // Показываем локальное видео
      const videoTrack = livekitRoom.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
      if (videoTrack && videoTrack.track) {
        addVideo(videoTrack.track, myUsername + ' (Вы)', 'local');
      }

      document.getElementById('videoArea').classList.add('active');
      document.getElementById('callRoomName').textContent = 'Комната: ' + roomName;
      document.getElementById('callBtn').textContent = '📞 Завершить';
      document.getElementById('callBtn').classList.add('end');
      currentRoom = roomName;
    } catch (err) {
      console.error(err);
      alert('Ошибка подключения к звонку: ' + err.message);
    }
  }

  // Обработка входящих видео/аудио
  function handleTrackSubscribed(track, publication, participant) {
    if (track.kind === 'video' || track.kind === 'audio') {
      addVideo(track, participant.identity, participant.sid);
    }
  }

  // Добавление видео на экран
  function addVideo(track, name, id) {
    const grid = document.getElementById('videoGrid');
    let container = document.getElementById('video-' + id);
    
    if (!container) {
      container = document.createElement('div');
      container.className = 'video-container';
      container.id = 'video-' + id;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = name;
      container.appendChild(label);
      grid.appendChild(container);
    }
    
    const element = track.attach();
    container.insertBefore(element, container.firstChild);
  }

  // Участник вышел
  function handleParticipantLeft(participant) {
    const el = document.getElementById('video-' + participant.sid);
    if (el) el.remove();
  }

  // Завершение звонка
  function endCall() {
    if (livekitRoom) {
      livekitRoom.disconnect();
      livekitRoom = null;
    }
    document.getElementById('videoArea').classList.remove('active');
    document.getElementById('videoGrid').innerHTML = '';
    document.getElementById('callBtn').textContent = '📞 Начать звонок';
    document.getElementById('callBtn').classList.remove('end');
    currentRoom = null;
  }

  // Микрофон
  async function toggleMic() {
    if (!livekitRoom) return;
    micEnabled = !micEnabled;
    await livekitRoom.localParticipant.setMicrophoneEnabled(micEnabled);
    document.getElementById('micBtn').classList.toggle('off', !micEnabled);
    document.getElementById('micBtn').textContent = micEnabled ? '🎤' : '🔇';
  }

  // Камера
  async function toggleCam() {
    if (!livekitRoom) return;
    camEnabled = !camEnabled;
    await livekitRoom.localParticipant.setCameraEnabled(camEnabled);
    document.getElementById('camBtn').classList.toggle('off', !camEnabled);
    document.getElementById('camBtn').textContent = camEnabled ? '📹' : '🚫';
  }

  // Безопасность (защита от XSS)
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Enter для входа
  document.getElementById('usernameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });
</script>

</body>
</html>
